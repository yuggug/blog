baseURL: "https://103254.xyz/"
locale: "zh-cn"
defaultContentLanguage: "zh-cn"
timeZone: "Asia/Shanghai"
title: "明明明的博客"
theme: "jijian"
hasCJKLanguage: true
enableRobotsTXT: true
cleanDestinationDir: true
summaryLength: 20
outputs:
  home:
    - HTML
    - RSS
menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: archives
      name: 时光轴
      url: /archives/
      weight: 20
params:
  env: production
  defaultTheme: auto
  DateFormat: "2006年01月02日" 
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true
  label:
    text: "明明明的博客"
    icon: /img/logo.png
    iconHeight: 32
  assets:
    favicon: /img/favicon.ico
    favicon16x16: /img/favicon-16x16.png
    favicon32x32: /img/favicon-32x32.png
    apple_touch_icon: /img/apple-touch-icon.png
